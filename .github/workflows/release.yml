name: Release Obsidian plugin

# Push a tag that equals manifest.json's version (e.g. 1.0.1, no "v" prefix)
# to build the plugin and create a draft GitHub release with the assets
# Obsidian downloads: main.js, manifest.json, styles.css.
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
